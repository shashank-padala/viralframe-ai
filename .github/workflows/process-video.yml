name: Process video

on:
  workflow_dispatch:
    inputs:
      project_id:
        description: "projects.id to process"
        required: true
        type: string
      mode:
        description: "full pipeline, cover-only regeneration, or the one-off cutaway test script"
        required: false
        type: choice
        options:
          - full
          - cover_only
          - cutaway_test
        default: full

jobs:
  process:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Install ffmpeg
        run: sudo apt-get update && sudo apt-get install -y ffmpeg

      - name: Install dependencies
        run: npm ci

      - name: Run pipeline
        env:
          NEXT_PUBLIC_SUPABASE_URL: ${{ secrets.NEXT_PUBLIC_SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          DEEPGRAM_API_KEY: ${{ secrets.DEEPGRAM_API_KEY }}
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          FAL_KEY: ${{ secrets.FAL_KEY }}
          PROJECT_ID: ${{ inputs.project_id }}
          MODE: ${{ inputs.mode }}
        run: |
          if [ "$MODE" = "cutaway_test" ]; then
            npx tsx scripts/pipeline/test-cutaway.ts
          else
            npx tsx scripts/pipeline/run.ts "$PROJECT_ID" "$MODE"
          fi
